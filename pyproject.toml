[project]
name = "cairn"
version = "0.0.1"
description = "巨石堆 — 本地优先的个人知识 / 资产 / 项目工作台"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HanYang06", email = "jihanyang123@163.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "argon2-cffi>=25.1.0",
    "blake3>=1.0.9",
    "cbor2>=6.1.4",
    "cryptography>=50.0.1",
    "fastcdc>=1.7.0",
    "pyside6>=6.8",
    "tomli-w>=1.2.0",
]

[project.scripts]
cairn = "cairn.ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.ruff]
target-version = "py313"
line-length = 100
# 第三方技能（vendored）保持上游原样，不参与本项目 lint。
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ARG", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Qt 的命名约定（QML 需要驼峰角色/属性/信号）与默认参数
"src/cairn/ui/backend.py" = ["N802", "N815", "B008"]
"src/cairn/ui/app.py" = ["N815"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
