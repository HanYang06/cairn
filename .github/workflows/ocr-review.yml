# PR 自动 AI 评审（OpenCodeReview, Apache-2.0）。
# 复用官方 composite action：它自行完成 checkout / 装 OCR / 跑 review / 发评论。
# 需要仓库 secret：DEEPSEEK_API_KEY（DeepSeek API key，映射到 OCR 的 llm_auth_token）。
# 详细输入见 https://github.com/alibaba/open-code-review/blob/main/action.yml

name: ocr-review

on:
  # pull_request_target 才能在 fork PR 上拿到 secret；OCR 只读 diff、不执行 PR 代码。
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # PR 事件直接跑；评论触发须为协作者发出的 /open-code-review 或 @open-code-review。
    if: |
      github.event_name == 'pull_request_target'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && contains(fromJSON('["MEMBER","OWNER","COLLABORATOR"]'), github.event.comment.author_association)
        && (
          startsWith(github.event.comment.body, '/open-code-review')
          || startsWith(github.event.comment.body, '@open-code-review')
        )
      )
    steps:
      # issue_comment 事件没有 PR 的 base/head，需自己取。
      - name: Get PR context
        id: pr-context
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('title', pr.title);

      - name: Run OpenCodeReview
        uses: alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d # v1.12.9
        with:
          llm_url: https://api.deepseek.com
          llm_auth_token: ${{ secrets.DEEPSEEK_API_KEY }}
          llm_model: deepseek-flash
          llm_use_anthropic: 'false'
          language: Chinese
          base_ref: ${{ steps.pr-context.outputs.base_ref }}
          head_sha: ${{ steps.pr-context.outputs.head_sha }}
          background: ${{ steps.pr-context.outputs.title || github.event.pull_request.title }}
          ocr_version: '1.12.9'
          sticky_summary: 'true'
          incremental: 'true'
          upload_artifacts: 'true'
